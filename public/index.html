<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text Pantry</title>
<style>
  :root { --bg: #e9efe6; --ink: #1f2a24; --muted: #5d6f63; --card: #fff; --line: #c8d5c9;
          --red: #c9402b; --gold: #f0c04a; --green: #2f6b4a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
  header { background: var(--green); color: #fff; padding: 22px 16px 18px; }
  header div, main { max-width: 700px; margin: 0 auto; }
  h1 { margin: 0; font: 700 30px/1.2 Georgia, serif; }
  header p { margin: 4px 0 0; opacity: .85; }
  main { padding: 18px 16px 48px; }
  #status { font-size: 14px; color: var(--muted); margin: 0 0 10px; }
  #status.ok { color: var(--green); } #status.err { color: var(--red); }
  input, textarea, select { width: 100%; font: inherit; padding: 10px 12px; border: 2px solid var(--line);
    border-radius: 10px; background: #fff; color: var(--ink); }
  #q { font-size: 18px; border-color: var(--green); }
  textarea { min-height: 90px; resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: 14px; }
  input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  button { font: inherit; font-weight: 600; padding: 9px 16px; border: 0; border-radius: 10px; background: var(--red); color: #fff; cursor: pointer; }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); padding: 5px 12px; font-size: 14px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  details { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin: 14px 0; }
  summary { font-weight: 700; cursor: pointer; }
  .form { display: grid; gap: 10px; margin-top: 12px; }
  .two { display: grid; grid-template-columns: 1fr 160px; gap: 10px; }
  .hint { font-size: 13px; color: var(--muted); margin: 0; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-top: 12px; }
  .item.top { border: 2px solid var(--green); }
  .head { display: flex; align-items: center; gap: 8px; }
  .title { font-weight: 700; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .tag { background: var(--gold); color: #3a2c00; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 99px; text-transform: uppercase; letter-spacing: .04em; }
  pre { margin: 10px 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 14px/1.5 ui-monospace, Consolas, monospace; background: #f4f7f3; padding: 10px; border-radius: 8px; }
  .btns { display: flex; gap: 8px; }
  .empty { text-align: center; color: var(--muted); padding: 28px 0; }
</style>
</head>
<body>
<header><div>
  <h1>Text Pantry</h1>
  <p>Stock up on useful text. Find it later by what it means, not just what it says.</p>
</div></header>

<main>
  <p id="status">Checking smart search...</p>
  <input id="q" type="search" placeholder="Search your pantry... try: how do I undo a commit" autocomplete="off" aria-label="Search">

  <details id="addBox">
    <summary>+ Add to pantry</summary>
    <div class="form">
      <div class="two">
        <input id="title" placeholder="Title (optional)" aria-label="Title">
        <select id="tag" aria-label="Type">
          <option>command</option><option>note</option><option>link</option>
          <option>template</option><option>hint</option><option>idea</option>
        </select>
      </div>
      <textarea id="text" placeholder="Paste or type your text..." aria-label="Text"></textarea>
      <p class="hint">Save password <em>hints</em>, never real passwords. Snippets are stored as a plain file on this computer.</p>
      <div class="btns"><button id="save">Save</button><button class="ghost" id="samples">Add example snippets</button></div>
    </div>
  </details>

  <div id="list"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let timer;

async function api(url, method = "GET", body) {
  const res = await fetch(url, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  return res.json();
}

// ---- Status: smart search loads in the background; keyword search works meanwhile ----
async function checkStatus() {
  try {
    const s = await api("/api/status");
    if (s.error) return setStatus("Model error: " + s.error + ". Keyword search still works.", "err");
    if (s.ready) return setStatus("Smart search ready (on your device). " + s.count + " snippet(s) saved.", "ok");
    setStatus(s.message + (s.percent != null ? " " + s.percent + "%" : "") + " Keyword search works meanwhile.");
  } catch { setStatus("Can't reach the server. Is it running?", "err"); }
  setTimeout(checkStatus, 1500);
}
function setStatus(t, c = "") { $("status").textContent = t; $("status").className = c; }

// ---- Show results ----
function render(items) {
  const list = $("list");
  list.innerHTML = "";
  if (!items.length) {
    list.innerHTML = '<p class="empty">' + ($("q").value.trim() ? "Nothing found." : "Your pantry is empty. Add a snippet above!") + "</p>";
    return;
  }
  items.forEach((s, i) => {
    const card = document.createElement("div");
    card.className = "item" + ($("q").value.trim() && i === 0 ? " top" : "");
    const head = document.createElement("div"); head.className = "head";
    const title = document.createElement("span"); title.className = "title"; title.textContent = s.title;
    const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = s.tag;
    head.append(title, tag);
    const pre = document.createElement("pre"); pre.textContent = s.text;
    const btns = document.createElement("div"); btns.className = "btns";
    const copy = document.createElement("button"); copy.className = "ghost"; copy.textContent = "Copy";
    copy.onclick = async () => { await navigator.clipboard.writeText(s.text); copy.textContent = "Copied!"; setTimeout(() => (copy.textContent = "Copy"), 1200); };
    const del = document.createElement("button"); del.className = "ghost"; del.textContent = "Delete";
    del.onclick = async () => { if (confirm("Delete this snippet?")) { await api("/api/snippets/" + s.id, "DELETE"); runSearch(); } };
    btns.append(copy, del);
    card.append(head, pre, btns);
    list.appendChild(card);
  });
}

async function runSearch() { render(await api("/api/search", "POST", { query: $("q").value })); }
$("q").oninput = () => { clearTimeout(timer); timer = setTimeout(runSearch, 300); };

// ---- Save ----
async function add(item) { return api("/api/snippets", "POST", item); }
$("save").onclick = async () => {
  if (!$("text").value.trim()) return $("text").focus();
  $("save").disabled = true;
  await add({ title: $("title").value, text: $("text").value, tag: $("tag").value });
  $("title").value = ""; $("text").value = "";
  $("save").disabled = false;
  $("q").value = ""; runSearch();
};

const SAMPLES = [
  { title: "Undo last git commit", tag: "command", text: "git reset --soft HEAD~1" },
  { title: "Polite follow-up email", tag: "template", text: "Hi [Name], just checking in on my earlier message. No rush, and thank you for your time!" },
  { title: "Wi-Fi password hint", tag: "hint", text: "Cat's name + the year we moved" },
  { title: "Kill a stuck process on a port", tag: "command", text: "npx kill-port 3000" },
  { title: "App idea", tag: "idea", text: "A plant-watering reminder that checks the weather forecast first." },
];
$("samples").onclick = async () => {
  $("samples").disabled = true; $("samples").textContent = "Adding...";
  for (const s of SAMPLES) await add(s);
  $("samples").textContent = "Add example snippets"; $("samples").disabled = false;
  runSearch();
};

checkStatus();
runSearch();
</script>
</body>
</html>
